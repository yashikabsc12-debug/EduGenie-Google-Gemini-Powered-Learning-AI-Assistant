<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>EduGenie</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='style.css') }}"
    >

</head>

<body>

<header class="hero">

    <div class="hero-content">

        <div class="logo">
            🎓 EduGenie
        </div>

        <h1>
            Your AI-Powered Learning Assistant
        </h1>

        <p>
            Ask questions, understand difficult topics,
            generate quizzes, summarize content,
            and create personalized learning paths.
        </p>

    </div>

</header>


<main class="container">

    <section class="task-section">

        <h2>
            What would you like to do?
        </h2>

        <div class="task-grid">

            <button
                class="task-button active"
                data-task="qa"
            >
                <span class="task-icon">💬</span>
                <strong>Ask a Question</strong>
                <small>Get a clear AI answer</small>
            </button>


            <button
                class="task-button"
                data-task="explain"
            >
                <span class="task-icon">💡</span>
                <strong>Explain a Topic</strong>
                <small>Learn difficult concepts</small>
            </button>


            <button
                class="task-button"
                data-task="quiz"
            >
                <span class="task-icon">📝</span>
                <strong>Generate Quiz</strong>
                <small>Test your knowledge</small>
            </button>


            <button
                class="task-button"
                data-task="summarize"
            >
                <span class="task-icon">📚</span>
                <strong>Summarize</strong>
                <small>Make revision easier</small>
            </button>


            <button
                class="task-button"
                data-task="recommend"
            >
                <span class="task-icon">🧭</span>
                <strong>Learning Path</strong>
                <small>Get personalized guidance</small>
            </button>

        </div>

    </section>


    <section class="input-card">

        <div class="form-group">

            <label id="input-label">
                Your question
            </label>

            <textarea
                id="main-input"
                rows="8"
                placeholder="Ask EduGenie anything..."
            ></textarea>

        </div>


        <div
            class="form-row"
            id="level-container"
        >

            <div class="form-group">

                <label for="level">
                    Your level
                </label>

                <select id="level">

                    <option value="beginner">
                        Beginner
                    </option>

                    <option value="intermediate">
                        Intermediate
                    </option>

                    <option value="advanced">
                        Advanced
                    </option>

                </select>

            </div>


            <div
                class="form-group"
                id="count-container"
                style="display: none;"
            >

                <label for="question-count">
                    Number of questions
                </label>

                <select id="question-count">

                    <option value="3">3</option>

                    <option
                        value="5"
                        selected
                    >
                        5
                    </option>

                    <option value="7">7</option>

                    <option value="10">10</option>

                </select>

            </div>

        </div>


        <div
            class="form-group"
            id="goal-container"
            style="display: none;"
        >

            <label for="goal">
                Your learning goal
            </label>

            <input
                type="text"
                id="goal"
                placeholder="Example: Build a machine learning project"
            >

        </div>


        <button
            id="submit-button"
            class="submit-button"
        >
            ✨ Generate
        </button>

    </section>


    <section
        id="status"
        class="status"
        style="display: none;"
    >
    </section>


    <section
        id="result-card"
        class="result-card"
        style="display: none;"
    >

        <div class="result-header">

            <h2 id="result-title">
                Result
            </h2>

        </div>


        <div id="result-content">
        </div>

    </section>

</main>


<footer>

    <p>
        EduGenie • Google Gemini Powered Learning Assistant
    </p>

</footer>


<script
    src="{{ url_for('static', path='app.js') }}"
></script>

</body>

</html>
